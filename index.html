<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Morning Princess</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="flower-bg"></div>

  <div class="container">
    <h1 class="typing">Did you sleep good?? 💗</h1>

    <button id="messageBtn">
      Click to see your cutie message 🌸
    </button>
  </div>

  <div id="popup" class="popup">
    <div class="popup-box">
      <span id="closeBtn">&times;</span>
      <h2>For my gorgous queen 💕</h2>
      <p>
        You are doing amazing, and I am so proud of the person you are
        I hope this little message makes you smile, even for a second.
        <br><br>
        The world feels brighter knowing you exist in it. I love you so much my baby hehehehe💗🌷
      </p>
      <button id="loveBtn">I love you forever 💖</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
